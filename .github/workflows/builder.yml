name: ISO builder

on:
  workflow_dispatch:
  schedule:
   - cron: '0 0 * * 0'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - run: |
          docker run --privileged -v /dev:/dev -v "$PWD:/w" -w /w ghcr.io/void-linux/void-glibc-full sh -ec '
            xbps-install -Syu xbps
            xbps-install -y bash git lzo e2fsprogs dosfstools
            git clone https://github.com/void-linux/void-mklive
            cd void-mklive
            mkdir -p includedir/root
            cp ../install.sh includedir/root/
            ./mklive.sh -p zfs -I includedir -S dhcpcd
            for iso in *.iso; do sha256sum "$iso" >"$iso.sha256"; done
            for pkg in glibc zfs; do
              v=$(xbps-uhelper binpkgver xbps-cachedir-x86_64/"$pkg"-[0-9]*.xbps)
              v=$(xbps-uhelper getpkgversion "$v")
              echo "- $pkg ${v%_*}"
            done >notes.md'
          gh release list --json tagName -q '.[].tagName' | xargs -rn1 gh release delete -y --cleanup-tag
          gh release create "$(date -u +%Y%m%d)" void-mklive/*.iso void-mklive/*.iso.sha256 -F void-mklive/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
